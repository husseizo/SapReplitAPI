<title>ZF Diagnosis Console</title>
<style>
/* ── DESIGN TOKENS ── */
:root {
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f8f9fb;
  --border:#e3e6ec; --border-h:#c8cdd8; --focus:#2563eb;
  --text:#111827; --text-2:#4b5563; --text-3:#9ca3af;
  --accent:#2563eb; --accent-bg:#eff6ff;
  --success:#059669; --success-bg:#ecfdf5;
  --warning:#b45309; --warning-bg:#fffbeb;
  --danger:#dc2626; --danger-bg:#fef2f2;
  --info:#0369a1; --info-bg:#f0f9ff;
  --nav-h:54px; --r:6px; --rl:8px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono","Cascadia Code","Fira Code",Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c2128;
  --border:#30363d; --border-h:#484f58;
  --text:#e6edf3; --text-2:#8b949e; --text-3:#484f58;
  --accent:#58a6ff; --accent-bg:#0c1a2e;
  --success:#3fb950; --success-bg:#0c1e10;
  --warning:#e3b341; --warning-bg:#1c1400;
  --danger:#f85149; --danger-bg:#1e0a09;
  --info:#79c0ff; --info-bg:#091529;
}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c2128;
  --border:#30363d; --border-h:#484f58;
  --text:#e6edf3; --text-2:#8b949e; --text-3:#484f58;
  --accent:#58a6ff; --accent-bg:#0c1a2e;
  --success:#3fb950; --success-bg:#0c1e10;
  --warning:#e3b341; --warning-bg:#1c1400;
  --danger:#f85149; --danger-bg:#1e0a09;
  --info:#79c0ff; --info-bg:#091529;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;margin:0;min-height:100%;-webkit-font-smoothing:antialiased}
button{font-family:var(--font)}svg{display:inline-block;flex-shrink:0}
.app-nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--border);height:var(--nav-h);display:flex;align-items:center;padding-inline:24px;z-index:100}
.nav-brand{font-size:14px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;margin-inline-end:28px;display:flex;align-items:center;gap:8px}
.brand-mark{width:8px;height:8px;border-radius:2px;background:var(--accent);flex-shrink:0}
.nav-links{display:flex;gap:2px;flex:1}
.nav-link{font-size:13.5px;font-weight:500;color:var(--text-2);padding:6px 12px;border-radius:var(--r);border:none;background:none;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--surface-2)}.nav-link.active{color:var(--accent);background:var(--accent-bg)}
.nav-link:disabled{color:var(--text-3);cursor:default}.nav-right{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.conn-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--border-h);flex-shrink:0}.cdot.live{background:var(--success)}.cdot.demo{background:var(--warning)}.cdot.err{background:var(--danger)}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;color:var(--text-2);transition:color .15s,background .15s}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}.icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app-body{max-width:1200px;margin:0 auto;padding-inline:24px;padding-block:28px}
.cfg-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-block-end:20px;overflow:hidden}
.cfg-inner{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.page-hdr{margin-block-end:24px}
.page-title{font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0 0 4px}
.page-sub{font-size:13.5px;color:var(--text-2);margin:0}
.search-block{margin-block-end:28px}
.search-row{display:flex;gap:10px;align-items:flex-end;max-width:480px}
.input-grp{display:flex;flex-direction:column;gap:5px;flex:1}
.inp-lbl{font-size:12px;font-weight:500;color:var(--text-2)}
.inp-wrap{position:relative}
.inp-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
input[type=text],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:14px;padding:8px 12px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.has-ico{padding-inline-start:34px}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 14%,transparent)}
.search-msg{font-size:12px;margin-block-start:5px}
.search-msg.err{color:var(--danger)}.search-msg.info{color:var(--text-3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-family:var(--font);font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:not(:disabled):hover{filter:brightness(1.08)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--surface-2);border-color:var(--border-h)}
.btn-ghost{background:transparent;color:var(--text-2);border-color:transparent}.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12.5px}
.form-grp{display:flex;flex-direction:column;gap:5px;flex:1 1 220px}
.form-grp.wide{flex:1 1 300px}.form-lbl{font-size:12px;font-weight:500;color:var(--text-2)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap}
.bd-danger{background:var(--danger-bg);color:var(--danger)}.bd-warning{background:var(--warning-bg);color:var(--warning)}
.bd-success{background:var(--success-bg);color:var(--success)}.bd-info{background:var(--info-bg);color:var(--info)}
.bd-neutral{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.bd-demo{background:var(--warning-bg);color:var(--warning);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-block-end:20px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-start}
.order-id{flex:0 0 auto}
.oid-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);display:block;margin-block-end:3px}
.oid-num{font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.order-fields{display:flex;flex-wrap:wrap;gap:10px 24px;flex:1;align-items:flex-start}
.ofield{display:flex;flex-direction:column;gap:2px}
.of-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.of-val{font-size:13px;font-weight:500;color:var(--text)}.of-val.mono{font-family:var(--mono);font-size:12px}
.order-btm{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:10px;flex:0 0 100%}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-block-end:10px}
.sec-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.inc-list{display:flex;flex-direction:column;gap:8px}
.inc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);border-left-width:3px;overflow:hidden}
.inc-card.sev-HIGH{border-left-color:var(--danger)}.inc-card.sev-MEDIUM{border-left-color:var(--warning)}
.inc-card.sev-LOW{border-left-color:var(--success)}.inc-card.sev-INFO{border-left-color:var(--info)}
.inc-trigger{width:100%;padding:14px 16px;background:none;border:none;cursor:pointer;display:flex;align-items:flex-start;gap:12px;text-align:left;transition:background .12s}
.inc-trigger:hover{background:var(--surface-2)}.inc-trigger:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.inc-sev-icon{flex-shrink:0;margin-block-start:2px}
.inc-main{flex:1;min-width:0}
.inc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.inc-code{font-size:11.5px;font-weight:600;color:var(--text-3);font-family:var(--mono);margin-block-end:2px}
.inc-title{font-size:14px;font-weight:600;color:var(--text);text-wrap:balance}
.inc-summ{font-size:12.5px;color:var(--text-2);margin-block-start:3px}
.inc-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-block-start:8px}
.meta-chip{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:3px}
.inc-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chevron{color:var(--text-3);transition:transform .2s}
.inc-card.open .chevron{transform:rotate(180deg)}
.inc-body{display:none;border-top:1px solid var(--border)}
.inc-card.open .inc-body{display:block}
.inc-sec{padding:16px 20px;border-bottom:1px solid var(--border)}
.inc-sec:last-child{border-bottom:none}
.inc-sec-ttl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-block-end:12px;display:flex;align-items:center;gap:6px}
.frow{display:flex;align-items:baseline;gap:12px;padding-block:6px;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:none}
.fr-lbl{font-size:12.5px;color:var(--text-2);flex:0 0 160px;white-space:nowrap}
.fr-val{font-size:13px;color:var(--text);flex:1;display:flex;align-items:center;gap:6px;word-break:break-all}
.fr-val.mono{font-family:var(--mono);font-size:12px}
.copy-btn{background:none;border:none;cursor:pointer;color:var(--text-3);padding:2px 4px;border-radius:3px;display:inline-flex;align-items:center;transition:color .12s,background .12s;flex-shrink:0}
.copy-btn:hover{color:var(--text-2);background:var(--surface-2)}.copy-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.div-banner{background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);border-radius:var(--r);padding:8px 12px;font-size:12.5px;color:var(--danger);display:flex;align-items:center;gap:8px;margin-block-end:10px}
.cmp-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);margin-block-end:14px}
.cmp-table{width:100%;border-collapse:collapse;min-width:360px}
.cmp-table th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;background:var(--surface-2);border-bottom:1px solid var(--border)}
.cmp-table th.col-zf{color:var(--accent)}.cmp-table th.col-sap{color:var(--warning)}.cmp-table th.col-f{color:var(--text-3)}
.cmp-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table td.col-f{font-size:12px;font-weight:500;color:var(--text-2);white-space:nowrap}
.cmp-table td.col-zf,.cmp-table td.col-sap{font-family:var(--mono);font-size:12px}
.cmp-table tr.row-mm td{background:var(--danger-bg)}
.v-miss{color:var(--text-3);font-style:italic}.v-bad{color:var(--danger);font-weight:600}.v-ok{color:var(--success)}
details.ev>summary{list-style:none;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--text-2);padding:3px 0;transition:color .12s}
details.ev>summary::-webkit-details-marker{display:none}
details.ev>summary:hover{color:var(--text)}.ev-tri{transition:transform .2s;color:var(--text-3)}
details.ev[open]>summary .ev-tri{transform:rotate(90deg)}
.ev-items{margin-block-start:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.ev-row{font-family:var(--mono);font-size:11.5px;color:var(--text-2);padding-block:3px;border-bottom:1px solid var(--border);word-break:break-all}
.ev-row:last-child{border-bottom:none}
.act-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.act-pair{grid-template-columns:1fr}}
.act-grp-lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-block-end:8px}
.act-grp-lbl.blocked{color:var(--danger)}.act-grp-lbl.safe{color:var(--text-2)}
.act-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);font-size:13px;border:1px solid var(--border);margin-block-end:6px;background:var(--surface-2)}
.act-item:last-child{margin-block-end:0}
.act-item.blk{color:var(--text-3);border-style:dashed}.act-item.blk .acode{text-decoration:line-through}
.act-item.dis{color:var(--text-3)}
.acode{font-family:var(--mono);font-size:12px;flex:1}.anote{font-size:11px;color:var(--text-3);font-style:italic}
.no-act{font-size:12.5px;color:var(--text-3);font-style:italic;padding-block:4px}
.det-sep{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block-end:12px}
@media(max-width:560px){.det-sep{grid-template-columns:1fr}}
.det-block{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.det-block-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-block-end:4px}
.det-block.det-human .det-block-lbl{color:var(--info)}
.det-val{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.hist-empty{font-size:13px;color:var(--text-3);font-style:italic;padding-block:6px}
.timeline{padding-inline-start:20px;position:relative}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--border)}
.tl-item{position:relative;padding-block-end:14px}
.tl-dot{position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl-when{font-size:11.5px;color:var(--text-3);margin-block-end:2px}
.tl-res{font-size:13px;font-weight:600;color:var(--text);font-family:var(--mono)}
.tl-res-human{font-size:11.5px;color:var(--info);font-family:var(--font)}
.tl-op{font-size:12.5px;color:var(--text-2);margin-block-start:1px}
.tl-why{font-size:12.5px;color:var(--text-2);font-style:italic;margin-block-start:2px}
.tl-st{margin-block-start:4px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);width:100%;max-width:500px;max-height:92dvh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;color:var(--text)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:13px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.info-callout{background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 22%,transparent);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--text-2);display:flex;align-items:flex-start;gap:8px}
.ic-icon{color:var(--info);flex-shrink:0;margin-block-start:1px}
.target-key{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text-2);word-break:break-all}
.effect-row{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.confirm-step{display:none}
.confirm-step.show{display:block}
.confirm-detail{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--text);margin-block-start:10px}
.confirm-row{display:flex;justify-content:space-between;padding-block:4px;border-bottom:1px solid var(--border);font-size:12.5px}
.confirm-row:last-child{border-bottom:none}
.cr-lbl{color:var(--text-3)}.cr-val{color:var(--text);font-family:var(--mono);font-size:12px}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:6px;z-index:300}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;font-size:13px;max-width:320px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);animation:tin .18s ease}
.toast.ok{border-left:3px solid var(--success);padding-inline-start:12px}
.toast.err{border-left:3px solid var(--danger);padding-inline-start:12px}
.toast.inf{border-left:3px solid var(--info);padding-inline-start:12px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.loading-row{display:flex;align-items:center;gap:10px;padding:24px 0;color:var(--text-2);font-size:13.5px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:32px;text-align:center;max-width:480px;margin:0 auto}
.welcome-ttl{font-size:16px;font-weight:600;margin:0 0 8px}
.welcome-sub{font-size:13.5px;color:var(--text-2);margin:0 0 20px;line-height:1.6}
.welcome-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty-state{padding:40px 20px;text-align:center}
.empty-state-ttl{font-size:15px;font-weight:600;color:var(--text-2);margin:0 0 6px}
.empty-state-sub{font-size:13px;color:var(--text-3);margin:0 0 16px}
.err-box{background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);border-radius:var(--r);padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.eb-icon{color:var(--danger);flex-shrink:0;margin-block-start:1px}
.eb-ttl{font-size:13.5px;font-weight:600;color:var(--danger);margin-block-end:3px}
.eb-msg{font-size:12.5px;color:var(--text-2);margin-block-end:8px}
.demo-bar{background:var(--warning-bg);border:1px solid color-mix(in srgb,var(--warning) 25%,transparent);border-radius:var(--r);padding:8px 14px;font-size:12.5px;color:var(--warning);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-block-end:16px}
.test-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-block-start:24px}
.test-panel-ttl{font-size:14px;font-weight:600;margin-block-end:12px;display:flex;align-items:center;gap:8px}
.test-row{display:flex;align-items:center;gap:10px;padding-block:5px;border-bottom:1px solid var(--border);font-size:12.5px}
.test-row:last-child{border-bottom:none}
.test-num{font-family:var(--mono);font-size:11px;color:var(--text-3);flex:0 0 28px}
.test-name{flex:1;color:var(--text-2)}.test-icon{flex-shrink:0;font-size:13px}
.test-icon.pass{color:var(--success)}.test-icon.fail{color:var(--danger)}.test-icon.skip{color:var(--text-3)}
@media(max-width:768px){.app-body{padding-inline:16px;padding-block:20px}.nav-brand{margin-inline-end:16px}.order-card{flex-direction:column}}
@media(max-width:480px){.app-body{padding-inline:12px}.search-row{flex-direction:column}.inc-right{display:none}.det-sep{grid-template-columns:1fr}}
</style>

var SEV_ICON = {HIGH:'i-alert',MEDIUM:'i-alert',LOW:'i-info',INFO:'i-info'};

        'Orchestration state: Accepted',
        'Consistency status: ZF_FRAGMENT_RDR1_MISSING',
        'Original orchestration evidence: ItemCode=VAG13782 was in fragment Id=20092 SoLineNum=1',

        code:'MANUAL_RESOLUTION_REQUIRED',

      }],

    }]
  },
  28890:{
    soDocEntry:28890,

    orchestrationState:'ZF_HEALTHY',
    consistencyStatus:'ZF_HEALTHY',
    hasActiveIncidents:false,
    incidents:[]
  },
  28917:{
    soDocEntry:28917,
    requestId:'bbbbbbbb-0000-0000-0000-000000000001',
    orchestrationState:'ZF_COMPLETED',
    consistencyStatus:'ZF_COMPLETED',
    hasActiveIncidents:false,
    incidents:[]
  }
};
var DEMO_HIST = {'28879_20092_ZF_FRAGMENT_RDR1_MISSING':{incidentKey:'28879_20092_ZF_FRAGMENT_RDR1_MISSING',docNum:28879,totalRecords:0,currentStatus:'ACTIVE',history:[]}};

// ── STATE ────────────────────────────────────────────────────────────────────
// mode: 'disconnected' | 'demo' | 'live'
// Production default is 'disconnected'. Demo requires explicit user action.
var S = {mode:'disconnected',apiUrl:'http://localhost:5050',apiKey:'',docNum:null,result:null,expanded:new Set(),histories:new Map(),resolveTarget:null};

function $(id){return document.getElementById(id)}
function el(t,c,tx){var e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e}
function ico(id,sz){sz=sz||16;return'<svg width="'+sz+'" height="'+sz+'" aria-hidden="true"><use href="#'+id+'"/></svg>'}
function fmtDate(s){if(!s)return'—';try{return new Date(s).toLocaleString(undefined,{dateStyle:'short',timeStyle:'short'})}catch(e){return s}}
function utcTip(s){if(!s)return'';return' title="UTC: '+s+'"'}

// ── THEME ────────────────────────────────────────────────────────────────────
function initTheme(){var t;try{t=localStorage.getItem('zf_theme')}catch(e){}if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);updateThemeIco()}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme'),dark=c==='dark'||(!c&&window.matchMedia('(prefers-color-scheme:dark)').matches),n=dark?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('zf_theme',n)}catch(e){}updateThemeIco()}
function updateThemeIco(){var c=document.documentElement.getAttribute('data-theme'),dark=c==='dark'||(!c&&window.matchMedia('(prefers-color-scheme:dark)').matches);$('theme-ico').innerHTML='<use href="#'+(dark?'i-sun':'i-moon')+'"/>';$('theme-btn').setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}

// ── CONNECTION STATE ──────────────────────────────────────────────────────────
function setMode(m){
  S.mode=m;
  var d=$('cdot'),l=$('conn-lbl');
  if(m==='live'){d.className='cdot live';l.textContent='Live · '+S.apiUrl.replace(/https?:\/\//,'')}
  else if(m==='demo'){d.className='cdot demo';l.textContent='Demo — example data'}
  else{d.className='cdot';l.textContent='Disconnected'}
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg,type){type=type||'inf';var t=document.createElement('div');t.className='toast '+type;var imap={ok:'i-check',err:'i-alert',inf:'i-info'};t.innerHTML=ico(imap[type]||'i-info',13)+'<span>'+msg+'</span>';$('toasts').prepend(t);setTimeout(function(){t.remove()},4500)}

// ── API CLIENT ────────────────────────────────────────────────────────────────
var API = {
  async getDiagnosticIncidents(docNum){
    if(S.mode==='demo'){await _delay(380);var d=DEMO[docNum];if(!d)throw _err('No ZF orchestration found for DocNum='+docNum+'.',404);return d}
    if(S.mode==='disconnected')throw _err('Not connected. Enter API credentials.',0);
    return _get('/api/zf-admin/orders/'+docNum+'/diagnostic-incidents');
  },
  async getIncidentResolutions(docNum,incidentKey){
    if(S.mode==='demo'){await _delay(180);return DEMO_HIST[incidentKey]||{incidentKey:incidentKey,docNum:docNum,totalRecords:0,currentStatus:'ACTIVE',history:[]}}
    if(S.mode==='disconnected')throw _err('Not connected.',0);
    return _get('/api/zf-admin/orders/'+docNum+'/diagnostic-incidents/'+encodeURIComponent(incidentKey)+'/resolutions');
  },
  async resolveIncident(docNum,incidentKey,body){
    if(S.mode==='demo'){
      await _delay(480);
      var inc=DEMO[docNum]&&DEMO[docNum].incidents.find(function(i){return i.incidentKey===incidentKey});
      if(!inc){var e=_err('INCIDENT_NOT_FOUND',404);e.body={error:'INCIDENT_NOT_FOUND'};throw e}
      var rec={id:Date.now(),incidentKey:incidentKey,soDocNum:docNum,resolution:body.resolution,status:RES_STATUS[body.resolution]||'ACTIVE',operator:body.operator,reason:body.reason,resolvedAtUtc:new Date().toISOString()};
      var h=DEMO_HIST[incidentKey]||{incidentKey:incidentKey,docNum:docNum,totalRecords:0,currentStatus:'ACTIVE',history:[]};
      h.history.push(rec);h.totalRecords++;h.currentStatus=rec.status;DEMO_HIST[incidentKey]=h;
      return{message:'Resolution recorded.',incidentKey:incidentKey,resultingStatus:rec.status,mutationAvailable:false,resolution:rec};
    }
    if(S.mode==='disconnected')throw _err('Not connected.',0);
    return _post('/api/zf-admin/orders/'+docNum+'/diagnostic-incidents/'+encodeURIComponent(incidentKey)+'/resolve',body);
  }
};
function _delay(ms){return new Promise(function(r){setTimeout(r,ms)})}
function _err(msg,status){return Object.assign(new Error(msg),{status:status})}
async function _get(path){var r=await fetch(S.apiUrl+path,{headers:{'X-ZF-Admin-Key':S.apiKey}});if(!r.ok){var b=await r.json().catch(function(){return{}});throw Object.assign(_err(b.message||'HTTP '+r.status,r.status),{body:b})}return r.json()}
async function _post(path,data){var r=await fetch(S.apiUrl+path,{method:'POST',headers:{'X-ZF-Admin-Key':S.apiKey,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok){var b=await r.json().catch(function(){return{}});throw Object.assign(_err(b.message||b.error||'HTTP '+r.status,r.status),{body:b})}return r.json()}

// ── BADGES ────────────────────────────────────────────────────────────────────
function statusBadgeCls(s){return{ACTIVE:'bd-danger',RESOLVED:'bd-success',ACKNOWLEDGED:'bd-warning',DEFERRED:'bd-info',HISTORICAL:'bd-neutral',RECOVERED:'bd-success'}[s]||'bd-neutral'}
function IncidentStatusBadge(s){return'<span class="badge '+statusBadgeCls(s)+'">'+s+'</span>'}
function sevBadgeCls(s){return{HIGH:'bd-danger',MEDIUM:'bd-warning',LOW:'bd-success',INFO:'bd-info'}[s]||'bd-neutral'}

// ── EVIDENCE PARSER (aligned with production evidence format) ─────────────────
function parseSapEvidence(arr){
  var r={};
  if(!arr)return r;
  arr.forEach(function(s){
    if(s.includes('no row found')||s.includes('no line found'))r.lineMissing=true;
    if(s.toLowerCase().includes('divergence:'))r.hasDivergence=true;
  });
  return r;
}

// ── COMPONENT: SapZfEvidenceComparison ────────────────────────────────────────
function SapZfEvidenceComparison(inc){
  var sap=parseSapEvidence(inc.evidence);
  var isDivergence=sap.hasDivergence||sap.lineMissing||inc.code==='ZF_FRAGMENT_RDR1_MISSING';
  var wrap=el('div','');
  if(isDivergence){
    var banner=el('div','div-banner');
    banner.innerHTML=ico('i-alert',14)+' <strong>Divergence Detected</strong> — SAP RDR1 line absent; ZF fragment expects it to exist.';
    wrap.append(banner);
  }
  var sapLineVal=isDivergence
    ?'<span class="v-bad">Missing — no RDR1 row</span>'
    :'<span class="v-ok">Present</span>';
  var rows=[
    ['Item Code',   inc.affectedItemCode||'—', isDivergence?'<span class="v-miss">absent (line missing)</span>':inc.affectedItemCode, isDivergence],
    ['Warehouse',   inc.expectedWhsCode||'—',  isDivergence?'<span class="v-miss">absent</span>':inc.expectedWhsCode,                 isDivergence],
    ['SO Line',     'Line '+(inc.soLineNum!=null?inc.soLineNum:'?'), sapLineVal,                                                       isDivergence],
    ['Quantity',    inc.expectedQty!=null?String(inc.expectedQty):'—', isDivergence?'<span class="v-miss">—</span>':String(inc.expectedQty), false],
    ['Fragment ID', inc.fragmentId!=null?String(inc.fragmentId):'—', '(ZF internal)',false],
  ];
  var tbl='<div class="cmp-wrap"><table class="cmp-table"><thead><tr><th class="col-f">Field</th><th class="col-zf">ZF Expected</th><th class="col-sap">SAP Current</th></tr></thead><tbody>';
  rows.forEach(function(r){

// ── COMPONENT: DiagnosisErrorState ───────────────────────────────────────────
function DiagnosisErrorState(err,retryFn){
  var msgs={
    401:{ttl:'Authentication Failed',msg:'Check your X-ZF-Admin-Key in the configuration panel.'},
    403:{ttl:'Access Denied',msg:'Your API key does not have permission to access this resource.'},
    404:{ttl:'Order Not Found',msg:'No ZF orchestration found for this SO number.'},
    INCIDENT_NOT_FOUND:{ttl:'Incident Not Found',msg:'Incident key is invalid or belongs to a different order. Refresh the diagnosis.'},
    0:{ttl:'Not Connected',msg:'Enter your API URL and admin key above, then click Connect.'},
    network:{ttl:'ZF Admin API Unavailable',msg:'The diagnosis service could not be reached. No SAP changes were made.'},
    500:{ttl:'Service Error',msg:'An internal error occurred. No SAP changes were made.'}
  };
  var code=String(err.status||'network');
  if(err.body&&err.body.error==='INCIDENT_NOT_FOUND')code='INCIDENT_NOT_FOUND';
  if(code==='0'&&err.message&&err.message.includes('Not connected'))code='0';
  var info=msgs[code]||msgs['network'];
  var box=el('div','err-box');
  box.innerHTML='<span class="eb-icon">'+ico('i-alert',16)+'</span><div><div class="eb-ttl">'+info.ttl+'</div><div class="eb-msg">'+info.msg+'</div></div>';
  if(retryFn&&code!=='0'){var rb=el('button','btn btn-secondary btn-sm','');rb.innerHTML=ico('i-refresh',13)+' Retry';rb.style.marginBlockStart='8px';rb.addEventListener('click',retryFn);box.querySelector('div').append(rb)}
  return box;
}

    wb.innerHTML='<p class="welcome-ttl">Connect to API</p><p class="welcome-sub">Enter your API URL and admin key to diagnose SO '+docNum+'.</p>'+

  var res=$('results');
  $('search-msg').textContent='';

  S.expanded.clear();S.histories.clear();S.result=null;S.docNum=docNum;

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openResolutionForm(docNum,inc){
  // Generate a fresh GUID for this operator decision.
  // The same GUID is reused on network retry (resolveTarget persists during the modal session).
  // A new GUID is generated only when the modal is opened fresh (new decision or new incident).
  var requestId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0;return(c==='x'?r:r&0x3|0x8).toString(16)});
  S.resolveTarget={docNum:docNum,incidentKey:inc.incidentKey,inc:inc,requestId:requestId};
  $('modal-key').textContent=inc.incidentKey;
  try{var op=sessionStorage.getItem('zf_op');if(op)$('res-op').value=op}catch(e){}
  $('res-sel').value='';$('res-why').value='';$('effect-row').hidden=true;
  showModalStep('form');$('modal').classList.add('open');
  setTimeout(function(){$('res-sel').focus()},50);
}
function showModalStep(step){
  var isConfirm=step==='confirm';
  $('modal-form-step').style.display=isConfirm?'none':'flex';
  $('modal-confirm-step').classList.toggle('show',isConfirm);
  $('modal-foot-form').style.display=isConfirm?'none':'flex';
  $('modal-foot-confirm').classList.toggle('show',isConfirm);
}
function closeModal(){$('modal').classList.remove('open');S.resolveTarget=null;showModalStep('form')}

$('res-sel').addEventListener('change',function(){
  var v=$('res-sel').value,er=$('effect-row'),et=$('effect-text');
  if(v&&RES_STATUS[v]){er.hidden=false;et.innerHTML='Incident status → '+IncidentStatusBadge(RES_STATUS[v])}
  else er.hidden=true;
});
$('modal-x').addEventListener('click',closeModal);
$('modal-cancel').addEventListener('click',closeModal);
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
$('modal-next').addEventListener('click',function(){
  var res=$('res-sel').value,op=$('res-op').value.trim(),why=$('res-why').value.trim();
  if(!res){toast('Select a resolution','err');return}
  if(!op){toast('Operator is required','err');return}
  if(!why){toast('Reason is required','err');return}
  var label=RES_LABELS[res]||res;
  $('confirm-detail').innerHTML=
    '<div class="confirm-row"><span class="cr-lbl">Resolution</span><span class="cr-val">'+label+'</span></div>'+
    '<div class="confirm-row"><span class="cr-lbl">Status change</span><span class="cr-val">'+IncidentStatusBadge('ACTIVE')+' → '+IncidentStatusBadge(RES_STATUS[res]||'ACTIVE')+'</span></div>'+
    '<div class="confirm-row"><span class="cr-lbl">Operator</span><span class="cr-val">'+op+'</span></div>'+
    '<div class="confirm-row"><span class="cr-lbl">Reason</span><span class="cr-val" style="font-style:italic">'+why+'</span></div>';
  showModalStep('confirm');$('modal-submit').focus();
});
$('modal-back').addEventListener('click',function(){showModalStep('form')});
$('modal-submit').addEventListener('click',async function(){
  var res=$('res-sel').value,op=$('res-op').value.trim(),why=$('res-why').value.trim();
  if(!S.resolveTarget)return;
  var btn=$('modal-submit');btn.disabled=true;btn.textContent='Recording…';
  try{sessionStorage.setItem('zf_op',op)}catch(e){}
  try{
    var r=await API.resolveIncident(S.resolveTarget.docNum,S.resolveTarget.incidentKey,{resolution:res,operator:op,reason:why,resolutionRequestId:S.resolveTarget.requestId});
    toast('Recorded — '+r.resultingStatus,'ok');
    var dn=S.resolveTarget.docNum,ik=S.resolveTarget.incidentKey;
    closeModal();
    S.histories.delete(ik);
    await handleDiagnose(dn);
  }catch(err){
    toast('Failed: '+err.message,'err');
    showModalStep('form');
  }finally{btn.disabled=false;btn.innerHTML=ico('i-clock',13)+' Record Resolution'}
});

async function runTests(){
  var panel=$('test-panel');if(!panel)return;
  var prev=S.mode;
  var rows=panel.querySelectorAll('.test-row');
  for(var i=0;i<TESTS.length;i++){
    var row=rows[i];if(!row)continue;
    var ic=row.querySelector('.test-icon');
    ic.className='test-icon skip';ic.textContent='…';
    try{
      var result=await Promise.resolve(TESTS[i][1]());
      ic.className='test-icon '+(result?'pass':'fail');
      ic.innerHTML=result?ico('i-check',13):ico('i-x',13);
    }catch(e){ic.className='test-icon fail';ic.innerHTML=ico('i-x',13);ic.title=e.message}
  }
  S.mode=prev;
}

function initTestPanel(){
  var panel=document.createElement('div');panel.className='test-panel';panel.id='test-panel';
  panel.innerHTML='<div class="test-panel-ttl">'+ico('i-check',14)+' Test Suite ('+TESTS.length+') <button class="btn btn-secondary btn-sm" id="run-tests-btn" style="margin-inline-start:8px">Run Tests</button></div>';
  TESTS.forEach(function(t,i){
    var n=i+1;
    var row=el('div','test-row');
    row.innerHTML='<span class="test-num">T'+(n<10?'0'+n:n)+'</span><span class="test-name">'+t[0]+'</span><span class="test-icon skip">—</span>';
    panel.append(row);
  });
  document.querySelector('.app-body').append(panel);
  $('run-tests-btn').addEventListener('click',runTests);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
initTheme();
setMode('disconnected');

var hash=window.location.hash.slice(1);
if(hash==='tests'){
  initTestPanel();
  // In test context, show welcome but don't auto-load (disconnected)
  renderWelcome();
} else {
  var initDoc=parseInt(hash,10);
  if(initDoc>0){
    $('so-input').value=String(initDoc);
    $('search-msg').textContent='Enter admin key to diagnose SO '+initDoc+', or use demo data.';
  }
  renderWelcome();
}

})();
</script>
